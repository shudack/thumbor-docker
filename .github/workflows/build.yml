name: Build Docker Images

env:
  DOCKERHUB_TAG: "shudack/thumbor"
  DOCKERHUB_SHORT_DESCRIPTION: "Unofficial thumbor image, pre-built with redis for storage"
  DOCKERHUB_README_FILE: "README.md"

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if this thumbor version already exists on Docker Hub"
        type: boolean
        default: false

jobs:
  check:
    name: Check for new thumbor version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Compare PyPI version with Docker Hub
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          VERSION=$(curl -fsSL https://pypi.org/pypi/thumbor/json | jq -r '.info.version')

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Could not determine thumbor version (got '$VERSION')"
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_TAG}/tags/${VERSION}")

          if [ "$STATUS" = "200" ] && [ "$FORCE" != "true" ]; then
            echo "thumbor ${VERSION} already published, skipping"
            PUBLISH=false
          elif [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
            PUBLISH=true
          else
            echo "ERROR: Unexpected Docker Hub response ${STATUS}"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.publish == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          build-args: |
            THUMBOR_VERSION=${{ needs.check.outputs.version }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_TAG }}:${{ needs.check.outputs.version }}
            ${{ env.DOCKERHUB_TAG }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pushreadme:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    needs:
      - build

    if: >
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Update Docker Hub Description
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          destination_container_repo: ${{ env.DOCKERHUB_TAG }}
          provider: dockerhub
          short_description: ${{ env.DOCKERHUB_SHORT_DESCRIPTION }}
          readme_file: ${{ env.DOCKERHUB_README_FILE }}

  keepalive:
    name: Prevent Workflow Suspension
    runs-on: ubuntu-latest
    
    if: github.event_name == 'schedule'
    
    permissions:
      actions: write

    steps:
      - name: Keep workflow alive
        uses: liskin/gh-workflow-keepalive@v1
